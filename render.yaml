services:
  - type: worker
    name: autoforwardbot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: autoforwardbot
      - key: OWNER_IDS
        sync: false
